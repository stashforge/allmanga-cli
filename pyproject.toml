[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "allmanga-cli"
version = "0.2.0"
description = "Terminal anime browser and player with AniList support."
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
allanime = [
    "cryptography>=41.0.0",
]
miruro = [
    "curl_cffi>=0.7.4",
]

[project.scripts]
allmanga-cli = "allmanga_cli.cli.main:run"

[tool.setuptools.packages.find]
include = ["allmanga_cli*"]
